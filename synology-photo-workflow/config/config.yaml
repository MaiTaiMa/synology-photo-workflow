paths:
  basedir: data/TEMP
  tempsd: data/TEMP/TEMPSD
  tempimages: data/TEMP/TEMPIMAGES
  tempdone: data/TEMP/TEMPDONE
  temperror: data/TEMP/TEMPERROR
  manualkeepinbox: data/TEMP/MANUALKEEP/inbox
  manualkeepused: data/TEMP/MANUALKEEP/used
  lockfile: data/TEMP/.workflow.lock
workflow:
  phaseexecution: phase1only
  batchlimit: 1
  batchsort: oldestfirst
  resumeincompletebatches: true
  datereconstruction: {mode: legacybash, decadeprefix: '202', yeardigitindex: 3}
automation:
  mode: assistedreview
  automaticphase2enabled: false
culling:
  enabled: true
  movefiles: true
  autokeepminrating: 2
  rejectthreshold: 0.35
  keepthreshold: 0.65
  finalcomponentweights: {basescore: 0.55, eyescore: 0.10, personalscore: 0.20, familyscore: 0.15}
  baseweights: {sharpness: 0.35, aesthetic: 0.35, exposure: 0.20, referencescore: 0.10}
familyrecognition:
  enabled: false
  backend: opencvyunetsface
  detectormodel: data/TEMP/WORKFLOW_DATA/models/face/face_detection_yunet.onnx
  recognizermodel: data/TEMP/WORKFLOW_DATA/models/face/face_recognition_sface.onnx
  similaritymetric: cosine_similarity
  matchthreshold: null
metadataculling:
  enabled: false
  allowrecoverysidecar: false
samples: {root: data/TEMP/WORKFLOW_DATA/samples}
runtime:
  root: data/TEMP/WORKFLOW_DATA/runtime
  state: data/TEMP/WORKFLOW_DATA/runtime/state
  runsummaries: data/TEMP/WORKFLOW_DATA/runtime/runsummaries
  calibrationbatches: data/TEMP/WORKFLOW_DATA/runtime/calibration/batches
  calibrationindex: data/TEMP/WORKFLOW_DATA/runtime/calibration/decisionindex.jsonl
  calibrationsummary: data/TEMP/WORKFLOW_DATA/runtime/calibration/calibrationsummary.json
calibration:
  enabled: true
  minimumreviewedbatches: 3
  minimumreviewedimages: 300
  minterminaldecisionagreement: 0.90
  maxrejecttokeeprate: 0.0
