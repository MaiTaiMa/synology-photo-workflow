# Synology Photo Workflow – vollständig kommentierte Beispielkonfiguration.
# Kopiere diese Datei nach config/config.yaml und passe ausschließlich lokale NAS-Pfade und bewusste Optionen an.
# Relative data/-Pfade liegen im persistenten Docker-Bind-Mount; keine personenbezogenen Daten gehören ins Git-Repository.

# Pfade der fachlichen Ein- und Ausgänge sowie der globalen Prozesssperre.
paths:
  basedir: data/TEMP # Erlaubtes Wurzelverzeichnis; alle TEMP-Pfade müssen darunter liegen.
  tempsd: data/TEMP/TEMP_SD # Eingang: neue, noch nicht verarbeitete Kameraordner.
  tempimages: data/TEMP/TEMP_IMAGES # Ergebnis von Phase 1 zur manuellen Bildsichtung.
  tempdone: data/TEMP/TEMP_DONE # Nur bewusst freigegebene Batches für die irreversible Phase 2.
  temperror: data/TEMP/TEMP_ERROR # Quarantäne für unsichere, beschädigte oder ungültige Batches.
  manualkeepinbox: data/TEMP/MANUAL_KEEP/inbox # Vorab gewählte externe JPGs für sichere Manual-Keep-Zuordnung.
  manualkeepused: data/TEMP/MANUAL_KEEP/used # Erfolgreich zugeordnete Manual-Keep-Dateien.
  lockfile: data/TEMP/.workflow.lock # Sperrdatei gegen parallele Python-Workflow-Läufe.

# Steuerung von Ausführungsreihenfolge, Stabilitätsprüfung, Zeitbudget und Wiederaufnahme.
workflow:
  phaseexecution: phase1only # phase1only, phase2only oder phase1thenphase2; CLI-Kommandos übersteuern diese Vorgabe.
  waittimeseconds: 0 # Wartezeit zwischen Stabilitätsprüfungen; 0 ist nur für lokale Tests sinnvoll.
  stalelockseconds: 43200 # Alter in Sekunden, ab dem eine verwaiste globale Sperre ersetzt werden darf.
  batchlimit: 1 # Maximale Batchanzahl pro Lauf; klein halten, um NAS-Ressourcen zu schützen.
  batchsort: oldestfirst # Reihenfolge neuer Batches; oldestfirst verarbeitet ältere Eingänge zuerst.
  resumeincompletebatches: true # Setzt pausierte oder unvollständige Batches vor neuen Phase-2-Batches fort.
  stabilityseconds: 0 # Mindestalter eines Eingangsordners; auf NAS auf einen sinnvollen positiven Wert setzen.
  maxrunhours: 10 # Kooperatives Laufzeitbudget; bei Ablauf wird ein wiederaufnehmbarer Pausenstatus geschrieben.
  batchlocknames: [.workflow.lock, .lock] # Dateinamen innerhalb eines Batches, die eine noch laufende Übertragung signalisieren.
  datereconstruction: # Übersetzt historische Kameraordnernamen in das Ausgabeformat YYYY-MM-DD.
    mode: legacybash # legacybash rekonstruiert historische Namen; fullyear akzeptiert nur echte YYYYMMDD-Namen.
    decadeprefix: '202' # Drei Ziffern des Jahrhunderts für die historische Legacy-Rekonstruktion.
    yeardigitindex: 3 # Index der Jahresziffer im historischen achtstelligen Kameraordnernamen.

# Sicherheitsgrenze zwischen manueller Sichtung und explizit freigegebener Automatik.
automation:
  mode: assistedreview # Sicherer Standard; automaticphase2 nur nach Kalibrierung und bewusster Freigabe.
  automaticphase2enabled: false # Zusätzlicher expliziter Schalter für automatische Übergabe nach TEMPDONE.
  approvalfile: data/TEMP/WORKFLOW_DATA/runtime/automation-approval.json # Persistente, kontextgebundene Nutzerfreigabe für Automatik.
  minimumstatus: eligibleconservative # Mindeststatus der Kalibrierung für die konservative Automatikstufe.

# Lokale, erklärbare Bildbewertung und die daraus abgeleiteten Vorschläge.
culling:
  enabled: true # Aktiviert die Bewertung; bei false bleibt der sichere Ordnerfluss ohne KI-Entscheidung nutzbar.
  movefiles: true # Verschiebt review/reject JPGs in die entsprechenden Unterordner.
  keepthreshold: 0.65 # Finalscore ab diesem normierten Wert ergibt zunächst keep.
  rejectthreshold: 0.35 # Finalscore unter diesem normierten Wert ergibt zunächst reject.
  autokeepminrating: 2 # Konservative Vorauswahlgrenze; kein Phase-2-Filter und keine menschliche Endentscheidung.
  finalcomponentweights: # Gewichte werden über verfügbare Komponenten auf 1,0 renormiert.
    basescore: 0.55 # Technische und ästhetische lokale Basisbewertung.
    eyescore: 0.10 # Optionales Augensignal; fehlt es, wird sein Gewicht nicht künstlich als null gewertet.
    personalscore: 0.20 # Optionaler Wert aus dem persönlichen Geschmacksmodell.
    familyscore: 0.15 # Optionales Familien-Signal; darf reject höchstens zu review anheben.
  baseweights: # Teilgewichte innerhalb des normierten Basiswerts.
    sharpness: 0.35 # Beitrag von Kanten-/Schärfemerkmalen.
    aesthetic: 0.35 # Beitrag einfacher erklärbarer Ästhetikmerkmale.
    exposure: 0.20 # Beitrag von Helligkeit, Kontrast und Clipping-Schutz.
    referencescore: 0.10 # Beitrag eines optionalen lokalen Referenzprofils.
  starratingbands: # Zuordnung des Finalscore zu sichtbaren 0-bis-5-Sterne-Bereichen.
    - {min: 0.00, max: 0.19, rating: 0} # Niedrigster Scorebereich.
    - {min: 0.20, max: 0.39, rating: 1} # Sehr schwacher Scorebereich.
    - {min: 0.40, max: 0.59, rating: 2} # Mittlerer Scorebereich.
    - {min: 0.60, max: 0.74, rating: 3} # Guter Scorebereich.
    - {min: 0.75, max: 0.89, rating: 4} # Sehr guter Scorebereich.
    - {min: 0.90, max: 1.00, rating: 5} # Höchster Scorebereich und Standardvoraussetzung für Sample-Vorschläge.

# Optionale Serienkorrektur ähnlicher Bilder innerhalb desselben Batchs; jederzeit deaktivierbar.
seriesdetection:
  enabled: true # Aktiviert die lokale Cluster- und Serienlogik; false lässt jede Bildentscheidung unverändert.
  clustereps: 0.18 # Maximaler Embedding-Abstand für ähnliche Bilder derselben Serie; kleiner ist strenger.
  minsamples: 2 # Mindestzahl ähnlicher Bilder, ab der ein Cluster als Serie zählt.
  reviewmargin: 0.03 # Nähe zum Serienbesten, innerhalb derer eine Alternative review statt reject bleiben kann.
  demotenonbestto: review # Zielentscheidung für nicht bestes Serienbild; zulässig ist derzeit review.

# Optionales kleines lokales Modell für persönlichen Geschmack; erst nach validierten Referenzen aktivieren.
personalscoring:
  enabled: false # Aktiviert das persistente Geschmackmodell als optionale Finalscore-Komponente.
  modelpath: data/TEMP/WORKFLOW_DATA/models/taste/active.json # Aktives Modellartefakt auf dem persistenten NAS-Mount.

# Sicherer Abgleich vorab ausgewählter externer JPGs mit Bildern des aktuellen Batchs.
manualkeep:
  enabled: true # Aktiviert Manual-Keep; ein eindeutiger Treffer erzwingt eine Keep-Entscheidung.
  similaritythreshold: 0.95 # Mindestähnlichkeit des besten Trefferkandidaten zwischen 0 und 1.
  minimummargin: 0.03 # Mindestvorsprung des besten gegenüber dem zweitbesten Treffer.

# Optionale Erkennung ausschließlich bekannter Familienpersonen; zunächst deaktiviert lassen.
familyrecognition:
  enabled: false # Aktiviert die Funktion erst nach realer NAS-Backend- und Referenzabnahme.
  backend: opencvyunetsface # Zielbackend laut Spezifikation; Installation und Modellvertrag müssen separat erfüllt sein.
  referencedir: data/TEMP/WORKFLOW_DATA/samples/family # Persistente Personenordner mit reference, newfaces und notused.
  cachedir: data/TEMP/WORKFLOW_DATA/runtime/family # Persistenter atomar aktivierter Embedding-Cache.
  maxreferenceimagesperperson: 10 # Begrenzung der pro Person aktiv genutzten Referenzen.
  minreferenceimagesperperson: 2 # Mindestzahl gültiger aktiver Referenzen für eine Person.
  matchtolerance: 0.45 # Aktueller Distanzwert des vorhandenen Backends; vor realem NAS-Test bewusst kalibrieren.
  matchthreshold: null # Reservierter Zielbackend-Schwellenwert; null bedeutet keine zusätzliche Schwelle im aktuellen Backend.
  protectmatches: true # Eindeutige Treffer dürfen reject nur zu review abschwächen.
  candidatecropsenabled: false # Erzeugt erst nach Referenztest Vorschläge in newfaces.
  minbestsecondmargin: 0.08 # Mindestabstand zwischen bestem und zweitbestem Personenmatch.
  minfacesizepx: 80 # Mindestkante eines Gesichts in Pixeln für Kandidaten-Crops.
  cropmarginpx: 12 # Zusätzlicher Bildrand in Pixeln um den erkannten Gesichtsausschnitt.
  mincropsharpness: 0.08 # Mindestwert der lokalen Crop-Schärfe.
  mincropexposure: 0.35 # Mindestwert der lokalen Crop-Belichtung.

# Optionales eingebettetes Schreiben von Bewertung und Workflow-Schlagworten in JPG-Dateien.
metadataculling:
  enabled: false # Aktiviert ExifTool-Schreib- und Rücklesevorgänge.
  exiftoolpath: exiftool # Programmname oder absoluter Pfad der ExifTool-Binärdatei im Container.
  allowrecoverysidecar: false # Sidecars nur als expliziter Recovery-Fallback, niemals still erzeugen.
  writerating: true # Schreibt die berechnete Sternebewertung als XMP-Rating.
  writekeywords: true # Schreibt namespaced Workflow-Schlagworte für Entscheidung und Serienrolle.
  required: false # Bei true blockiert ein Metadatenfehler den erfolgreichen Phase-1-Abschluss.

# Persönliche Geschmackssamples, deren aktive Auswahl ausschließlich selection.json autorisiert.
samples:
  root: data/TEMP/WORKFLOW_DATA/samples # Persistenter Stamm mit reference, newrefs, notused, selection.json und candidates.json.
  candidatesenabled: false # Erzeugt nur bei bewusster Aktivierung neue menschlich zu prüfende Sample-Vorschläge.
  candidatequalitymin: 0.75 # Mindestqualität eines Bildes für einen Sample-Vorschlag.
  candidateratingmin: 5 # Mindeststernzahl eines Bildes für einen Sample-Vorschlag.
  candidatenoveltymin: 0.15 # Mindestneuheit gegenüber der bestehenden Auswahl.

# Persistente Laufzeitdaten; diese Pfade müssen auf dem NAS-Bind-Mount liegen.
runtime:
  root: data/TEMP/WORKFLOW_DATA/runtime # Gemeinsamer Stamm aller nicht im Container verlorengehenden Laufzeitdaten.
  state: data/TEMP/WORKFLOW_DATA/runtime/state # Atomare Batch-Zustandsdateien für Resume und Phasenfortschritt.
  runsummaries: data/TEMP/WORKFLOW_DATA/runtime/runsummaries # Maschinenlesbare Zusammenfassungen jedes Workflow-Laufs.
  calibrationbatches: data/TEMP/WORKFLOW_DATA/runtime/calibration/batches # Unveränderliche validierte Review-Entscheidungsrecords.
  calibrationindex: data/TEMP/WORKFLOW_DATA/runtime/calibration/decisionindex.jsonl # Abgeleiteter Index der validen Review-Records.
  calibrationsummary: data/TEMP/WORKFLOW_DATA/runtime/calibration/calibrationsummary.json # Aktueller Kalibrierungsstatus für Automatik-Gates.
  quarantine: data/TEMP/WORKFLOW_DATA/runtime/quarantine # Kopien ungültiger Steuerdateien mit dokumentiertem Fehlergrund.

# Konservative Kalibrierung; sie empfiehlt höchstens Automatik und ändert nie still automation.mode.
calibration:
  enabled: true # Erzeugt Review-Records und Statusauswertung für manuell freigegebene Batches.
  minimumreviewedbatches: 3 # Mindestzahl kompatibler manuell geprüfter Batches vor einer Eignungsaussage.
  minimumreviewedimages: 300 # Mindestzahl kompatibler manuell geprüfter Bilder vor einer Eignungsaussage.
  minterminaldecisionagreement: 0.90 # Mindestübereinstimmung direkter keep/reject Vorhersagen mit Endentscheidungen.
  maxrejecttokeeprate: 0.0 # Sicherheitsgrenze: automatisch reject vorhergesagt, manuell keep darf nicht auftreten.

# Version der aktuell sichtbaren Regel- oder Modellkonfiguration; Änderung trennt Kalibrierungs-Kontexte.
models:
  version: rule-v1 # Stabile Modellkennung; bei fachlicher Regeländerung bewusst erhöhen.

# Mindestmenge für das vorhandene lokale Training; der Wert ist keine Freigabe für automatische Phase 2.
training:
  minlabeledimages: 4 # Mindestzahl gültiger beschrifteter Beispiele für den lokalen Trainingspfad.

# Gültige Werte und Konfigurationsregeln: Diese Zeilen sind Kommentare und werden nicht als YAML geladen.
# workflow.phaseexecution: phase1only | phase2only | phase1thenphase2.
# automation.mode: assistedreview | automaticphase2conservative | automaticphase2.
# workflow.datereconstruction.mode: legacybash | fullyear; fullyear verlangt gültige Namen YYYYMMDD.
# culling.decisionmode ist nur ein Kompatibilitätsalias: manual/assistedreview -> assistedreview, automatic/automaticphase2 -> automaticphase2.
# Setze culling.decisionmode nicht zusätzlich zu automation.mode; abweichende Werte werden als Konfigurationsfehler abgewiesen.
# Alle Schwellwerte und Gewichte müssen numerisch sein; rejectthreshold < keepthreshold und beide liegen in [0,1].
# finalcomponentweights muss exakt basescore, eyescore, personalscore und familyscore enthalten; die Summe muss größer als null sein.
# baseweights muss exakt sharpness, aesthetic, exposure und referencescore enthalten; die Summe muss größer als null sein.
# Alle paths.* außer basedir müssen innerhalb paths.basedir liegen; Pfadausbrüche werden beim Laden blockiert.
# Optionales Feature aktivieren: familyrecognition.enabled, personalscoring.enabled, metadataculling.enabled oder samples.candidatesenabled auf true setzen.
# Automatische Phase 2 verlangt gleichzeitig automation.mode != assistedreview, automaticphase2enabled: true, phase1thenphase2, gültige Kalibrierung und approvalfile.
# YAML-Variablen werden nicht durch Umgebungsvariablen interpoliert; Docker-/NAS-Wurzelpfad wird ausschließlich über .env: WORKFLOW_DATA_ROOT gesetzt.
