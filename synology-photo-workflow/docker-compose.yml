# Synology Photo Workflow | docker-compose.yml
# Mitentwickler: MaiTai | Erstellt: 2026-07-29 | Projektversion: 7.7.0
# Funktion: Beispiel fuer persistenten, least-privilege NAS-Mount.
services:
  workflow:
    build: .
    user: "1026:100"
    volumes:
      - /volume1/photo-workflow:/data:rw
      - ./config/config.yaml:/app/config/config.yaml:ro
    command: ["--config", "/app/config/config.yaml", "run"]
    restart: "no"
